name: Publish verified rule snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths: ['lists/**', 'baseline/**', 'publish.py', 'review.py', 'review-cases.json', 'test_publish.py', 'public-key.pem', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: rules-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Validate publisher
        run: env -u GITHUB_STEP_SUMMARY python3 -m unittest test_publish
      - name: Prepare pinned compatibility core
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 --output "$RUNNER_TEMP/mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz
          echo "60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 700 "$RUNNER_TEMP/mihomo"
      - name: Build and sign changed data
        env:
          RULE_SIGNING_KEY: ${{ secrets.RULE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$RULE_SIGNING_KEY" > "$signing_key"
          unset RULE_SIGNING_KEY
          openssl pkey -in "$signing_key" -pubout | cmp - public-key.pem
          python3 publish.py --key "$signing_key" --core "$RUNNER_TEMP/mihomo"
      - name: Publish complete snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add latest snapshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified routing data'
          git push origin HEAD:main
