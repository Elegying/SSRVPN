name: Bug report
description: Report a reproducible problem in SSRVPN.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - macOS
        - Windows
        - Shared package
        - CI/release
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact subscription URLs, API secrets, passwords, bearer tokens, and proxy credentials.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Latest release tag or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and device
      description: Include the OS version and device model or CPU architecture when known.
      placeholder: Android 16 / Pixel 9, macOS 26 / Apple silicon, or Windows 11 / x64
    validations:
      required: true
  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      options:
        - Android system VPN
        - System proxy
        - TUN
        - Not connected / not applicable
    validations:
      required: true
  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive data check
      options:
        - label: I removed subscription URLs, API secrets, passwords, bearer tokens, proxy credentials, and private server addresses.
          required: true
