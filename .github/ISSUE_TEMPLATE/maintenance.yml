name: 维护任务
description: 跟踪重构、依赖、发布、文档或仓库治理工作。
title: "[Maintenance] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 跨平台共享逻辑
        - Android
        - macOS
        - Windows
        - CI / 发布
        - 文档
        - 安全
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 任务与价值
      description: 请说明要维护什么、为什么现在需要做，以及完成后的可验证结果。
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 完成清单
      value: |
        - [ ] 实现或内容修改
        - [ ] 测试或验证证据
        - [ ] 文档同步
        - [ ] 用户可见变化已写入 CHANGELOG
