name: SSRVPN CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  changes:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      platform_required: ${{ steps.scope.outputs.platform_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          platform_required="$(
            python3 scripts/classify-ci-scope.py \
              --event "$EVENT_NAME" \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          )"
          case "$platform_required" in
            true|false) ;;
            *)
              echo "Invalid CI scope output: $platform_required" >&2
              exit 1
              ;;
          esac
          echo "platform_required=$platform_required" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          show-openssf-scorecard: true

  codeql-actions:
    name: CodeQL (Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze workflow code
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

  dependency-preflight:
    name: Dependency and source preflight
    needs: [changes, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.platform_required == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: needs.changes.outputs.platform_required == 'true'
        run: flutter pub get --enforce-lockfile
      - run: bash scripts/check-version-sync.sh
      - run: bash scripts/check-package-guides.sh
      - run: bash scripts/check-doc-consistency.sh
      - run: bash scripts/check-shared-barrel-imports.sh
      - run: bash scripts/check-android-built-in-kotlin.sh

      - run: python3 -m unittest scripts.test_third_party_licenses

  shared:
    name: Workspace checks
    needs: [changes, core-assets, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: needs.changes.outputs.platform_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-assets
          path: .

      - if: needs.changes.outputs.platform_required == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - if: needs.changes.outputs.platform_required == 'true'
        run: flutter pub get --enforce-lockfile
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-core-asset-bootstrap.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-shared-barrel-imports.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-version-sync.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-package-guides.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-doc-consistency.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-quality-hygiene.sh
      # Match the Release job's package working directory so guard scripts
      # cannot accidentally depend on being launched from the repository root.
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash ../../scripts/check-android-native-bridge-guards.sh
        working-directory: packages/ssrvpn_shared
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-android-built-in-kotlin.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-product-surface-guards.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-desktop-startup-guards.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-desktop-secure-storage.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-clash-service-boundaries.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-macos-core-privileges.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/test-macos-tun-dns-transaction.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-windows-launcher-security.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-secrets.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/test-release-tooling.sh
      - if: needs.changes.outputs.platform_required == 'true'
        run: flutter analyze
        working-directory: packages/ssrvpn_shared
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/run-flutter-coverage.sh packages/ssrvpn_shared
      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-coverage-thresholds.sh packages/ssrvpn_shared

      - if: always() && needs.changes.outputs.platform_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shared
          path: packages/ssrvpn_shared/coverage

      - name: Validate documentation-only change
        if: needs.changes.outputs.platform_required == 'false'
        run: |
          bash scripts/check-doc-consistency.sh
          python3 -m unittest scripts.test_third_party_licenses scripts.test_ci_docs_scope scripts.test_classify_ci_scope scripts.test_doc_consistency

  core-assets:
    name: Prepare verified core assets
    needs: [changes, dependency-preflight]
    if: always()
    runs-on: ${{ needs.changes.outputs.platform_required == 'true' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      # Keep a required check failed (not merely skipped) when preflight fails.
      - name: Require successful dependency preflight
        env:
          PREFLIGHT_RESULT: ${{ needs.dependency-preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success
      - name: Require valid CI scope
        env:
          SCOPE: ${{ needs.changes.outputs.platform_required }}
        run: |
          case "$SCOPE" in
            true|false) ;;
            *) exit 1 ;;
          esac

      - if: needs.changes.outputs.platform_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cache only content-addressed binaries, never credentials or build state.
      # bootstrap always validates the restored bytes and rebuilds missing/mismatched assets.
      - name: Cache verified core assets
        if: needs.changes.outputs.platform_required == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: verified-cores-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/proxy_traffic/**', 'SSRVPN_Android/assets/libgojni-source.txt', 'SSRVPN_MacOS/assets/AtlasCore-source.txt', 'SSRVPN_Windows/assets/mihomo-source.txt', 'docs/GEOIP_SOURCE.txt', 'scripts/build-core-asset.py', 'scripts/build-android-core.sh', 'scripts/build-desktop-core.sh', 'scripts/core-traffic-source.py', 'scripts/bootstrap-core-assets.sh', 'scripts/verify-core-assets.sh', 'scripts/verify_android_core_*.py') }}
          path: |
            SSRVPN_Android/android/app/src/main/jniLibs/arm64-v8a/libgojni.so
            SSRVPN_Android/assets/geoip.metadb.gz
            SSRVPN_MacOS/assets/AtlasCore.gz
            SSRVPN_MacOS/assets/geoip.metadb.gz
            SSRVPN_Windows/assets/mihomo.exe
            SSRVPN_Windows/assets/geoip.metadb.gz

      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/bootstrap-core-assets.sh

      - name: Preserve failed core rebuild diagnostics
        if: failure() && needs.changes.outputs.platform_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failed-core-rebuild
          retention-days: 3
          path: ${{ runner.temp }}/ssrvpn-core-diagnostics


      - if: needs.changes.outputs.platform_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-assets
          retention-days: 14
          path: |
            SSRVPN_Android/android/app/src/main/jniLibs/arm64-v8a/libgojni.so
            SSRVPN_Android/assets/geoip.metadb.gz
            SSRVPN_MacOS/assets/AtlasCore.gz
            SSRVPN_MacOS/assets/geoip.metadb.gz
            SSRVPN_Windows/assets/mihomo.exe
            SSRVPN_Windows/assets/geoip.metadb.gz

  macos-native:
    name: macOS native unit tests
    if: needs.changes.outputs.platform_required == 'true'
    needs: [changes, core-assets, secret-scan]
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-assets
          path: .

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: bash scripts/verify-core-assets.sh
      - run: flutter pub get --enforce-lockfile

      - name: Run macOS native unit tests
        timeout-minutes: 15
        run: bash scripts/test-macos-native.sh

      # Resolve packages before tracing; XCTest remains independent of CodeQL.
      - name: Resolve Swift packages before CodeQL
        timeout-minutes: 10
        working-directory: SSRVPN_MacOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace -scheme Runner \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ssrvpn-swift-packages"

      - name: Initialize Swift CodeQL
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build arm64 Swift source for CodeQL
        timeout-minutes: 30
        working-directory: SSRVPN_MacOS
        run: |
          xcodebuild build -quiet \
            -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ssrvpn-swift-codeql" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ssrvpn-swift-packages" \
            -disableAutomaticPackageResolution \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

      - name: Analyze Swift source
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          category: /language:swift

  flutter-app:
    name: ${{ matrix.name }}
    needs: [changes, core-assets, secret-scan]
    runs-on: ${{ needs.changes.outputs.platform_required == 'true' && matrix.os || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            directory: SSRVPN_Android
            codeql_language: java-kotlin
            codeql_build_mode: manual
          - name: macOS
            os: macos-15
            directory: SSRVPN_MacOS
    steps:
      - name: Reject invalid CI scope
        if: needs.changes.outputs.platform_required != 'true' && needs.changes.outputs.platform_required != 'false'
        run: |
          echo "Invalid CI scope classification" >&2
          exit 1

      - name: Skip platform build for documentation-only changes
        if: needs.changes.outputs.platform_required == 'false'
        run: echo "Documentation-only change; platform build is not required."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.platform_required == 'true'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.changes.outputs.platform_required == 'true'
        with:
          name: core-assets
          path: .

      - uses: ./.github/actions/setup-flutter
        if: needs.changes.outputs.platform_required == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/verify-core-assets.sh

      - name: Verify macOS proxy-only traffic
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_MacOS'
        run: python3 scripts/check-core-proxy-traffic.py SSRVPN_MacOS/assets/AtlasCore.gz

      - if: needs.changes.outputs.platform_required == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Verify production routing on real core
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_MacOS'
        run: python3 scripts/check-routing-core.py

      - name: Verify real-core dual-stack forwarding
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_MacOS'
        timeout-minutes: 10
        run: |
          python3 scripts/check-core-dual-stack.py
          python3 scripts/check-core-dual-stack-protocols.py

      - name: Verify imported protocol traffic
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_MacOS'
        timeout-minutes: 5
        run: python3 scripts/check-imported-protocol-traffic.py --restls

      - name: Initialize CodeQL
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory != 'SSRVPN_MacOS'
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.codeql_language }}
          build-mode: ${{ matrix.codeql_build_mode }}
          queries: security-extended

      - name: Cache Gradle dependencies
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_Android'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - if: needs.changes.outputs.platform_required == 'true'
        run: flutter analyze
        working-directory: ${{ matrix.directory }}

      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/run-flutter-coverage.sh ${{ matrix.directory }}

      - name: Android native unit tests
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_Android'
        shell: bash
        run: bash scripts/test-android-native.sh

      - if: needs.changes.outputs.platform_required == 'true'
        run: bash scripts/check-coverage-thresholds.sh ${{ matrix.directory }}

      - name: Build macOS app
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory == 'SSRVPN_MacOS'
        timeout-minutes: 15
        working-directory: SSRVPN_MacOS
        run: flutter build macos --debug --dart-define-from-file=../config/ssrvpn-usage-defines.json

      - name: Analyze native code
        if: needs.changes.outputs.platform_required == 'true' && matrix.directory != 'SSRVPN_MacOS'
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && needs.changes.outputs.platform_required == 'true'
        with:
          name: coverage-${{ matrix.directory }}
          path: ${{ matrix.directory }}/coverage/lcov.info

  windows-policy-tests:
    name: Windows policy tests
    if: needs.changes.outputs.platform_required == 'true'
    needs: [changes, secret-scan, dependency-preflight]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Physical latency with DNS port 53 blocked
        shell: powershell
        timeout-minutes: 5
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\test_windows_physical_latency.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows policy tests
        shell: powershell
        timeout-minutes: 10
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\test_windows_policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive Windows transaction behavior evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-transaction-evidence
          path: |
            ${{ runner.temp }}/installer-ownership-*/**/*.json
            ${{ runner.temp }}/installer-ownership-*/**/*.log
            ${{ runner.temp }}/installer-ownership-*/**/*.status

  windows-tests:
    name: Windows Flutter tests
    if: needs.changes.outputs.platform_required == 'true'
    needs: [changes, core-assets, secret-scan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-assets
          path: .

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: bash scripts/verify-core-assets.sh
      - run: flutter pub get --enforce-lockfile

      - name: Shared tests on Windows
        run: flutter test --reporter expanded
        working-directory: packages/ssrvpn_shared

      - run: flutter analyze
        working-directory: SSRVPN_Windows

      - run: bash scripts/run-flutter-coverage.sh SSRVPN_Windows
      - run: bash scripts/check-coverage-thresholds.sh SSRVPN_Windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-SSRVPN_Windows
          path: SSRVPN_Windows/coverage/lcov.info

  windows-build:
    name: Windows build
    if: needs.changes.outputs.platform_required == 'true'
    needs: [changes, core-assets, secret-scan]
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-assets
          path: .

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: bash scripts/verify-core-assets.sh
      - run: flutter pub get --enforce-lockfile

      - name: Verify Windows proxy-only traffic
        shell: bash
        run: python3 scripts/check-core-proxy-traffic.py SSRVPN_Windows/assets/mihomo.exe

      - name: Verify imported protocol traffic
        shell: bash
        timeout-minutes: 5
        run: python3 scripts/check-imported-protocol-traffic.py --core SSRVPN_Windows/assets/mihomo.exe

      - name: Initialize CodeQL
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build Windows installer
        shell: powershell
        timeout-minutes: 15
        run: |
          cd SSRVPN_Windows
          # Windows PowerShell does not stop when a child process returns non-zero.
          # Keep every child exit check adjacent so later builds cannot mask a failure.
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tool\package_windows.ps1 -DartDefineFromFile ..\config\ssrvpn-usage-defines.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\scripts\test_windows_native_proxy_recovery.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tool\build_installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\scripts\test_windows_installer_package.ps1 -InstallerPath .\SSRVPN_Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-smoke-logs
          path: ${{ runner.temp }}/ssrvpn-installer-smoke/*.log
          if-no-files-found: ignore

      - name: Smoke Windows installer
        shell: bash
        run: bash scripts/smoke-release-artifacts.sh --allow-missing

      - name: Analyze native code
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-pr
          path: |
            SSRVPN_Windows/SSRVPN_Setup.exe
            SSRVPN_Windows/SSRVPN_Setup.exe.sha256

  windows:
    name: Windows
    if: always()
    needs: [changes, windows-policy-tests, windows-tests, windows-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows gate
        env:
          SCOPE: ${{ needs.changes.outputs.platform_required }}
          POLICY_RESULT: ${{ needs.windows-policy-tests.result }}
          TEST_RESULT: ${{ needs.windows-tests.result }}
          BUILD_RESULT: ${{ needs.windows-build.result }}
        run: |
          if [ "$SCOPE" = true ]; then
            if [ "$POLICY_RESULT" != success ] ||
               [ "$TEST_RESULT" != success ] ||
               [ "$BUILD_RESULT" != success ]; then
              echo "Windows gates failed: policy=$POLICY_RESULT tests=$TEST_RESULT build=$BUILD_RESULT" >&2
              exit 1
            fi
            exit 0
          fi

          if [ "$SCOPE" = false ]; then
            if [ "$POLICY_RESULT" != skipped ] ||
               [ "$TEST_RESULT" != skipped ] ||
               [ "$BUILD_RESULT" != skipped ]; then
              echo "Unexpected docs-only Windows state: policy=$POLICY_RESULT tests=$TEST_RESULT build=$BUILD_RESULT" >&2
              exit 1
            fi
            exit 0
          fi

          echo "Invalid CI scope classification: $SCOPE" >&2
          exit 1
