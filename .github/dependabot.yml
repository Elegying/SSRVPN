version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Flutter SDK pins these packages; review them with a Flutter upgrade.
      flutter-sdk-bound:
        patterns:
          - "meta"
          - "characters"
          - "collection"
          - "test"
      pub-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "meta"
          - "characters"
          - "collection"
          - "test"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dart"
  - package-ecosystem: "gradle"
    directory: "/SSRVPN_Android/android"
    schedule:
      interval: "weekly"
    groups:
      # AGP, Gradle and Kotlin must migrate together with verification metadata.
      android-toolchain:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "org.gradle.*"
          - "gradle"
      android-gradle-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "org.gradle.*"
          - "gradle"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "android"
